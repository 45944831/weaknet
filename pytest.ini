[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -p no:cacheprovider --strict-markers -m "not perf and not device"
markers =
    unit: 纯逻辑，无网络、无进程外依赖（毫秒~秒级）
    integration: 进程内起真实服务，走 socket（秒级）
    perf: 性能门槛，结果与机器相关，默认不跑（pytest -m perf）
    device: 需要真机（ANDROID_SERIAL）与 adb，默认不跑（pytest -m device）
