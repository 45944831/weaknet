# ruff：只开 E/F（语法错、未定义名、未使用导入/变量），不做风格强制。
# 先保证「真问题能拦住」，格式化留给后续讨论，避免一次引入上千条风格告警
# 把已有的 clean 状态冲掉。CI 里只检查核心源码与单测，手工脚本不拦。
target-version = "py38"
line-length = 120

[lint]
select = ["E", "F"]
ignore = [
    "E501",   # 行长交给编辑器/评审，硬折行会破坏注释里的表格
    "E402",   # 延迟导入是本项目有意的写法（先 sys.path 再 import）
]

[lint.per-file-ignores]
# 单测/夹具里「赋值但没用」多为构造 payload 的可读写法，不算缺陷
"tests/*" = ["F841"]
# 手工真机/探针脚本（tests/_*.py）：大量重定义、单行多语句是探针式写法，
# 不做风格门禁；F821（未定义名）仍然保留——那是真会跑崩的错。
"tests/_*.py" = ["F401", "F811", "F841", "E401", "E701", "E702", "E712", "E741"]

[format]
quote-style = "double"
